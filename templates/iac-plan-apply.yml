include:
  - local: 'templates/iac-base.yml'

.iac_template_plan_base:
  stage: plan
  image: "${IAC_PIPELINE_IMAGE}"
  resource_group: "${IAC_RESOURCE_GROUP}"
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    # In my setup, I am using self signed CA in our self managed GitLab instance
    SSL_CERT_FILE: /tmp/ci-ca-bundle.crt
    # AWS_CA_BUNDLE should be required by different aws/tf/tg tools
    AWS_CA_BUNDLE: /tmp/ci-ca-bundle.crt
    # CURL_CA_BUNDLE is read by curl (SSL_CERT_FILE is NOT read by curl).
    # Required for post_plan_note curl calls to the GitLab API over TLS.
    CURL_CA_BUNDLE: /tmp/ci-ca-bundle.crt
    # iam-policy-autopilot telemetry: env var has the highest precedence (beats
    # the persisted ~/.iam-policy-autopilot/config.json choice), so policy
    # generation never phones home even on the first run of a fresh job
    # container. The per-job `telemetry --disable` call is a belt-and-braces
    # persisted fallback.
    DISABLE_IAM_POLICY_AUTOPILOT_TELEMETRY: "true"
    # iam-policy-autopilot MR comment switch. The per-stack policies are
    # ALWAYS generated and kept as plan-mr-preview artifacts
    # (.terragrunt-plans/reports/*.iam-policies.json). Set to "false" in a
    # consumer repo to skip appending them to the MR plan comment (useful when
    # many resources change -> large generated policies -> huge MR comment).
    IAM_POLICY_AUTOPILOT_TO_MR_COMMENT: "true"
    # iam-policy-autopilot job-log switch. The pretty JSON is also echoed to
    # the plan-mr-preview job log (the job trace, NOT the MR comment); set to
    # "false" to keep the log small when many resources change (the artifacts
    # and the optional MR comment still exist).
    IAM_POLICY_AUTOPILOT_APPEND_TO_JOB_LOG: "true"
  before_script:
    - |
      set -euo pipefail

      normalize_cert() {
        local input_path="$1" output_path="$2"
        # Multi-cert PEM bundle (e.g. old + re-issued intermediate): copy as-is.
        # openssl x509 would only keep the FIRST cert, dropping the rest.
        local count
        count="$(grep -c -- '-----BEGIN CERTIFICATE-----' "$input_path" 2>/dev/null || echo 0)"
        if [ "${count:-0}" -gt 1 ]; then
          cp -f "$input_path" "$output_path"
          return 0
        fi
        if openssl x509 -in "$input_path" -noout >/dev/null 2>&1; then
          openssl x509 -in "$input_path" -out "$output_path" >/dev/null 2>&1 || cp -f "$input_path" "$output_path"
          return 0
        fi
        if openssl x509 -inform DER -in "$input_path" -noout >/dev/null 2>&1; then
          openssl x509 -inform DER -in "$input_path" -out "$output_path"
          return 0
        fi
        echo "ERROR: '$input_path' is not a valid X.509 certificate (PEM or DER)." >&2
        return 1
      }

      if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
        cp /etc/ssl/certs/ca-certificates.crt /tmp/ci-ca-bundle.crt
      elif [ -f /etc/pki/tls/certs/ca-bundle.crt ]; then
        cp /etc/pki/tls/certs/ca-bundle.crt /tmp/ci-ca-bundle.crt
      else
        touch /tmp/ci-ca-bundle.crt
      fi
      if [ -n "${LOCAL_INTERMEDIATE_CA_CERT_FILE:-}" ] && [ -f "${LOCAL_INTERMEDIATE_CA_CERT_FILE}" ]; then
        echo "Appending intermediate CA: ${LOCAL_INTERMEDIATE_CA_CERT_FILE}"
        normalize_cert "${LOCAL_INTERMEDIATE_CA_CERT_FILE}" /tmp/local-intermediate.pem
        printf '\n' >> /tmp/ci-ca-bundle.crt
        cat /tmp/local-intermediate.pem >> /tmp/ci-ca-bundle.crt
      fi
      if [ -n "${LOCAL_ROOT_CA_CERT_FILE:-}" ] && [ -f "${LOCAL_ROOT_CA_CERT_FILE}" ]; then
        echo "Appending root CA: ${LOCAL_ROOT_CA_CERT_FILE}"
        normalize_cert "${LOCAL_ROOT_CA_CERT_FILE}" /tmp/local-root.pem
        printf '\n' >> /tmp/ci-ca-bundle.crt
        cat /tmp/local-root.pem >> /tmp/ci-ca-bundle.crt
      fi
      for runner_ca in \
          /usr/local/share/ca-certificates/ca-cert-ca.pem \
          /etc/ssl/certs/ca-cert-ca.pem \
          /usr/share/ca-certificates/ca-cert-ca.pem; do
        if [ -f "${runner_ca}" ]; then
          echo "Appending runner-injected CA bundle: ${runner_ca}"
          printf '\n' >> /tmp/ci-ca-bundle.crt
          cat "${runner_ca}" >> /tmp/ci-ca-bundle.crt
          break
        fi
      done

      # De-duplicate EXACT duplicate certs (same sha256 fingerprint) only.
      # Do NOT dedup by subject_hash: a re-issued intermediate (same subject +
      # key, new serial) MUST coexist with the old one — OpenSSL matches the
      # leaf's AKI serial against the issuer's serial, so both versions are
      # needed while old leaf certs are still in use.
      awk 'BEGIN{inb=0; buf=""; n=0}
        /-----BEGIN CERTIFICATE-----/{inb=1; buf=$0"\n"; next}
        inb{buf=buf $0"\n"}
        /-----END CERTIFICATE-----/{inb=0; n++; f="/tmp/ci-cert-"n".pem"; printf "%s",buf > f; buf=""}
        END{}
      ' /tmp/ci-ca-bundle.crt

      rm -f /tmp/ci-ca-bundle.new
      : > /tmp/ci-ca-bundle.new
      declare -A seen=()
      for f in /tmp/ci-cert-*.pem; do
        [ -s "$f" ] || continue
        fp="$(openssl x509 -in "$f" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2 || echo bad)"
        if [ "$fp" != bad ] && [ -z "${seen[$fp]:-}" ]; then
          seen[$fp]=1
          cat "$f" >> /tmp/ci-ca-bundle.new
        elif [ "$fp" = bad ]; then
          echo "WARNING: dropping invalid cert block $f from bundle" >&2
        else
          echo "Dedup: dropping exact-duplicate cert (sha256=${fp:0:16}...) from $f" >&2
        fi
      done
      rm -f /tmp/ci-cert-*.pem
      mv /tmp/ci-ca-bundle.new /tmp/ci-ca-bundle.crt
      echo "CA bundle ready (dedup): /tmp/ci-ca-bundle.crt ($(grep -c -- '-----BEGIN CERTIFICATE-----' /tmp/ci-ca-bundle.crt) certs)"

      export SSL_CERT_FILE=/tmp/ci-ca-bundle.crt
      export AWS_CA_BUNDLE=/tmp/ci-ca-bundle.crt
      export GIT_SSL_CAINFO=/tmp/ci-ca-bundle.crt
      export CURL_CA_BUNDLE=/tmp/ci-ca-bundle.crt

      if [ -n "${SOPS_AGE_KEY:-}" ]; then
        umask 077
        printf '%s' "${SOPS_AGE_KEY}" | tr -d '\r' > /tmp/sops-age.key
        printf '\n' >> /tmp/sops-age.key
        export SOPS_AGE_KEY_FILE=/tmp/sops-age.key
      fi
      if [ -n "${SOPS_AGE_KEY_FILE:-}" ]; then
        if [ ! -r "${SOPS_AGE_KEY_FILE}" ]; then
          echo "ERROR: SOPS_AGE_KEY_FILE is set but not readable: ${SOPS_AGE_KEY_FILE}" >&2
          exit 1
        fi

        first_key_line="$(awk 'NF { print; exit }' "${SOPS_AGE_KEY_FILE}" || true)"
        case "${first_key_line}" in
          AGE-SECRET-KEY-1*)
            echo "SOPS age key: configured via SOPS_AGE_KEY_FILE=${SOPS_AGE_KEY_FILE}"
            ;;
          age1*)
            echo "ERROR: SOPS age key looks like a public recipient, not a private identity." >&2
            echo "Expected the first non-empty line to start with AGE-SECRET-KEY-1." >&2
            exit 1
            ;;
          -----BEGIN\ AGE\ ENCRYPTED\ FILE-----*)
            echo "ERROR: SOPS age key looks like an encrypted age file, not a decrypted private identity." >&2
            exit 1
            ;;
          "")
            echo "ERROR: SOPS age key file is empty: ${SOPS_AGE_KEY_FILE}" >&2
            exit 1
            ;;
          *)
            echo "ERROR: SOPS age key does not look like an age private identity." >&2
            echo "First non-empty line: ${first_key_line}" >&2
            exit 1
            ;;
        esac

        if command -v age-keygen >/dev/null 2>&1; then
          derived_recipient="$(age-keygen -y "${SOPS_AGE_KEY_FILE}" 2>/dev/null || true)"
          if [ -n "${derived_recipient}" ]; then
            echo "SOPS age recipient derived from CI key: ${derived_recipient}"
          else
            echo "WARNING: age-keygen is available but could not derive a recipient from ${SOPS_AGE_KEY_FILE}" >&2
          fi
        else
          echo "NOTE: age-keygen not available; skipping recipient derivation"
        fi
      else
        echo "SOPS age key: NOT configured (SOPS_AGE_KEY/SOPS_AGE_KEY_FILE missing)"
      fi

      git config --global --add safe.directory "${CI_PROJECT_DIR}"
      mkdir -p "${HOME}/.terraform.d/plugins"
    # IAM Roles Anywhere: configure credential_process (no-op unless AWS_RA_ENABLED=true).
    - !reference [.iac_template_aws_ra_init, script]

# Shared plan-notes publishing helper.
# Usage: post_plan_note preview|main
#   preview : MR pipeline -> posts/updates ONE advisory plan note on the MR
#             via the notes API (tfplan2md markdown only).
#   main    : post-merge pipeline -> posts the deployable plan as a COMMIT
#             COMMENT on CI_COMMIT_SHA (renders markdown on the commit page).
#             Pipelines/jobs have no notes API and no job-summary surface in
#             GitLab. NEVER posts to the MR.
# All API calls are non-fatal: a missing token or API outage must never
# fail a plan job.
.iac-plan-notes:
  script:
    - |
      # Helper: run curl and on failure, print HTTP status + truncated body.
      # Usage: _curl_or_warn "warning message" <curl args...>
      _curl_or_warn() {
        local warn_msg="$1"; shift
        local resp_file err_file code
        resp_file="$(mktemp)"
        err_file="$(mktemp)"
        code="$(curl -sS -o "${resp_file}" -w '%{http_code}' "$@" 2>"${err_file}")" || true
        case "${code}" in
          200|201|204) rm -f "${resp_file}" "${err_file}"; return 0 ;;
        esac
        echo "WARNING: ${warn_msg} (non-fatal)"
        echo "  HTTP status: ${code}"
        echo "  curl stderr: $(head -c 500 "${err_file}" 2>/dev/null)"
        echo "  Response: $(head -c 500 "${resp_file}" 2>/dev/null)"
        rm -f "${resp_file}" "${err_file}"
        return 0
      }

      post_plan_note() {
        local mode="${1:-preview}"

        case "${mode}" in
          preview|main) ;;
          *) echo "ERROR: post_plan_note: unknown mode '${mode}' (use preview|main)"; return 1 ;;
        esac

        PLAN_ROOT="${TF_ROOT}/.terragrunt-plans"
        REPORT_ROOT="${PLAN_ROOT}/reports"

        if [ -z "${GITLAB_API_TOKEN:-}" ] && [ "${mode}" = "preview" ]; then
          echo "NOTE: MR plan note skipped (GITLAB_API_TOKEN not set)"
          return 0
        fi

        # ---- collect per-stack tfplan2md reports -------------------------------
        local found=0 f
        for f in "${REPORT_ROOT}"/*.plan.md; do
          [ -s "$f" ] && found=1 && break
        done
        if [ "$found" -eq 0 ]; then
          echo "NOTE: no .plan.md reports produced; nothing to publish"
          return 0
        fi

        local marker
        case "${mode}" in
          preview) marker="iac-plan-preview-v1" ;;
          main)    marker="iac-plan-main-v1" ;;
        esac

        local note_file="${PLAN_ROOT}/plan-notes.md"
        {
          echo "<!-- ${marker} pipeline:${CI_PIPELINE_ID} -->"
          if [ "${mode}" = "preview" ]; then
            if [ -z "${CI_MERGE_REQUEST_IID:-}" ]; then
              echo "NOTE: not an MR pipeline; preview note skipped"
              return 0
            fi
            echo "# 📋 IaC plan preview (advisory)"
            echo "Commit \`${CI_COMMIT_SHA}\` · Pipeline [#${CI_PIPELINE_IID}](${CI_PIPELINE_URL})"
            echo "_NOT the saved plan that will be applied — the deployable plan is generated by \`plan-main\` after merge._"
          else
            echo "# 🚀 IaC plan (deployable saved plan)"
            echo "Commit \`${CI_COMMIT_SHA}\` · Pipeline [#${CI_PIPELINE_IID}](${CI_PIPELINE_URL}) · Job [${CI_JOB_NAME} #${CI_JOB_ID}](${CI_JOB_URL})"
            echo "Plan reports: [browse saved summaries](${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/browse/.terragrunt-plans/reports?job=plan-main-save-plan-summary) (uploaded by \`plan-main-save-plan-summary\`; kept without expiry)"
            echo "_This is the saved plan the manual \`apply\` job of this pipeline will apply._"
          fi
          echo "_Counts may double-count resources touched by more than one stack — treat as advisory._"
          echo
          for f in "${REPORT_ROOT}"/*.plan.md; do
            [ -s "$f" ] || continue
            echo "<details open><summary>$(basename "$f" .plan.md)</summary>"
            echo
            cat "$f"
            echo
            echo "</details>"
            echo
          done
        } > "${note_file}"

        # Append the iam-policy-autopilot suggestions to the SAME single
        # advisory MR note (preview only; main/apply don't ship policies yet).
        # Gated by IAM_POLICY_AUTOPILOT_TO_MR_COMMENT; the artifacts are always
        # generated either way.
        if [ "${mode}" = "preview" ]; then
          if [ "${IAM_POLICY_AUTOPILOT_TO_MR_COMMENT:-true}" = "true" ]; then
            render_iam_policies_md "${REPORT_ROOT}" "${note_file}" || true
          else
            echo "NOTE: IAM policies NOT appended to the MR comment"
            echo "      (IAM_POLICY_AUTOPILOT_TO_MR_COMMENT=${IAM_POLICY_AUTOPILOT_TO_MR_COMMENT:-});"
            echo "      generated policies remain in the job artifacts under reports/."
          fi
        else
          echo "NOTE: iam-policy-autopilot policies are MR-preview-only artifacts;"
          echo "      not appended to the deployable plan commit comment."
        fi

        # stay under the ~1 MB notes API limit
        if [ "$(wc -c < "${note_file}")" -gt 900000 ]; then
          head -c 900000 "${note_file}" > "${note_file}.tmp"
          printf '\n\n_…truncated (full plans in job artifacts)_\n' >> "${note_file}.tmp"
          mv "${note_file}.tmp" "${note_file}"
        fi

        if [ "${mode}" = "preview" ]; then
          # MR notes: delete previous preview notes, then post fresh so the
          # MR keeps exactly one live plan note (Atlantis-style).
          local old_ids id
          old_ids="$(curl --silent --fail --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes?per_page=100" \
            | jq -r --arg m "${marker}" '.[] | select(.body | contains($m)) | .id' || true)"
          for id in ${old_ids}; do
            curl --silent --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/${id}" || true
          done
          _curl_or_warn "failed to post plan note to MR" \
            --request POST \
            --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
            --data-urlencode "body@${note_file}"
        else
          # main mode: pipelines/jobs have NO notes API and no job-summary
          # surface in GitLab (CI_JOB_SUMMARY is GitHub Actions only).
          # Post the plan as a commit comment on CI_COMMIT_SHA — it renders
          # markdown on the commit page. Never touches the MR.
          if [ -z "${GITLAB_API_TOKEN:-}" ]; then
            echo "NOTE: plan commit comment skipped (GITLAB_API_TOKEN not set); summary only in ${note_file}"
          else
            # Commit comments have no DELETE API -> check-then-post keeps
            # job retries idempotent.
            local already
            already="$(curl --silent --fail --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
                "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/comments" \
              | jq -r --arg m "${marker} pipeline:${CI_PIPELINE_ID}" \
                  '[.[] | select(.note | contains($m))] | length' || echo 0)"
            if [ "${already:-0}" -gt 0 ]; then
              echo "Commit comment for this pipeline already exists; skipping."
            else
              _curl_or_warn "failed to post plan comment on commit" \
                --request POST \
                --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
                "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/comments" \
                --data-urlencode "note@${note_file}"
            fi
          fi

          # Future-proofing no-op: if GitLab ever ships GitHub-style job
          # summaries, also render there. Harmless on current versions.
          if [ -n "${CI_JOB_SUMMARY:-}" ] && [ -f "${CI_JOB_SUMMARY}" ]; then
            cat "${note_file}" >> "${CI_JOB_SUMMARY}"
          fi
        fi
      }

# Renders the per-stack iam-policy-autopilot output (generated by
# plan-mr-preview) as markdown. Appended to the single advisory MR plan note
# by post_plan_note preview — no extra GitLab API calls. Kept separate from
# .iac-plan-notes because the deployable plan-main/apply flow does not ship
# generated policies yet. The note JSON is pretty (the .iam-policies.json
# artifact is saved from the --pretty run), so no re-format is needed here.
# Usage: render_iam_policies_md <report_root> <output_md_file>
.iac-plan-iam-policies:
  script:
    - |
      render_iam_policies_md() {
        local report_root="$1" out_file="$2" f policy_count
        local found=0
        for f in "${report_root}"/*.iam-policies.json; do
          [ -s "$f" ] && found=1 && break
        done
        [ "$found" -eq 0 ] && return 0
        {
          echo
          echo "## 🔐 IAM policies suggested by iam-policy-autopilot (advisory)"
          echo "_Least-privilege identity-policy suggestions derived from each stack's \`terraform show -json\` plan._"
          echo "_Best-effort — review before use; \`Warnings\` flag statements that fell back to a \`\"Resource\": \"*\"\` wildcard._"
          echo
          for f in "${report_root}"/*.iam-policies.json; do
            [ -s "$f" ] || continue
            # Total statement count across all generated policies ('?' when the
            # file isn't the expected JSON shape; e.g. tool failure kept || true).
            policy_count="$(jq '[.Policies // [] | .[] | (.Policy.Statement // []) | length] | add // 0' "$f" 2>/dev/null || echo '?')"
            [ -n "${policy_count}" ] || policy_count="?"
            echo "<details><summary>$(basename "$f" .iam-policies.json) — ${policy_count} statement(s)</summary>"
            echo
            echo '```json'
            cat "$f"
            echo '```'
            echo
            echo "</details>"
            # Anchor the closing tag in its own paragraph. GitLab does not
            # always break a fence-then-HTML-tag sequence, and (since the
            # artifact's trailing newline is stripped by $(...)/echo) this
            # also guarantees the trailing </details> is never glued to the
            # closing ``` fence. '--' = horizontal rule / signature break.
            echo
            echo '-- '
            echo
          done
        } >> "${out_file}"
      }

plan-mr-preview:
  extends:
    - .iac_template_plan_base
  script:
    - !reference [.iac-plan-notes, script]
    - !reference [.iac-plan-iam-policies, script]
    - |
      set -euo pipefail
      cd ${TF_ROOT}
      echo "TLS env: SSL_CERT_FILE=${SSL_CERT_FILE:-} AWS_CA_BUNDLE=${AWS_CA_BUNDLE:-}"
      echo "================================================================"
      echo "MR preview only:"
      echo "1) This plan is advisory and is NOT the saved plan that "
      echo "will be applied later. The deployable saved plan is generated"
      echo "at the 'plan-main' task after merging to the main branch."
      echo "2) tf-summarize and tfplan2md are the tools to detect changes"
      echo "They are best effort and may have bugs."
      echo "3) iam-policy-autopilot derives advisory least-privilege IAM policies"
      echo "from each stack's 'terragrunt show -json' plan. Also best effort:"
      echo "review before use."
      echo "================================================================"

      if ! command -v openssl >/dev/null 2>&1; then
        echo "ERROR: openssl is required but was not found in PATH."
        exit 1
      fi

      if ! command -v tf-summarize >/dev/null 2>&1; then
        echo "WARNING: tf-summarize was not found. Text plan summary will be skipped."
      fi

      TFPLAN2MD_BIN=""
      if command -v tfplan2md >/dev/null 2>&1; then
        TFPLAN2MD_BIN="$(command -v tfplan2md)"
      elif [ -x /app/tfplan2md ]; then
        TFPLAN2MD_BIN="/app/tfplan2md"
      else
        echo "WARNING: tfplan2md was not found. Markdown plan rendering will be skipped."
      fi

      # iam-policy-autopilot: baked into ${IAC_PIPELINE_IMAGE} at
      # /usr/local/bin/iam-policy-autopilot (atlantis-custom-image). Advisory
      # only: missing binary or tool failure must never fail the plan.
      IAM_POLICY_AUTOPILOT_BIN=""
      if [ -x /usr/local/bin/iam-policy-autopilot ]; then
        IAM_POLICY_AUTOPILOT_BIN="/usr/local/bin/iam-policy-autopilot"
      elif command -v iam-policy-autopilot >/dev/null 2>&1; then
        IAM_POLICY_AUTOPILOT_BIN="$(command -v iam-policy-autopilot)"
      fi
      if [ -n "${IAM_POLICY_AUTOPILOT_BIN}" ]; then
        # Persist the opt-out choice for this container (belt-and-braces on top
        # of DISABLE_IAM_POLICY_AUTOPILOT_TELEMETRY=true, which outranks it).
        "${IAM_POLICY_AUTOPILOT_BIN}" telemetry --disable >/dev/null 2>&1 || true
      else
        echo "NOTE: iam-policy-autopilot not found; IAM policy generation will be skipped."
      fi
      PLAN_ROOT="${TF_ROOT}/.terragrunt-plans"
      rm -rf "${PLAN_ROOT}"
      mkdir -p "${PLAN_ROOT}" "${PLAN_ROOT}/reports"

      # Fail fast on dependency cycles or invalid stack config: terramate
      # exits non-zero with a "cycle detected" error when the Terragrunt
      # dependency DAG is not acyclic.
      if ! terramate list --run-order >/dev/null 2>&1; then
        echo "ERROR: terramate could not build the stack dependency graph (cycle detected or invalid stack config)."
        echo "Run 'terramate list --run-order' locally to see the full error."
        exit 1
      fi

      # ${IAC_TERRAMATE_PLAN_EXTRA_FLAGS} defaults to
      # "--include-all-dependents --run-order": re-plan stacks that depend on
      # a changed stack (their inputs may change) and iterate in dependency
      # (DAG) execution order so the per-stack loop plans dependencies
      # before dependents.
      CHANGED_STACKS="$(terramate list --changed ${IAC_TERRAMATE_PLAN_EXTRA_FLAGS})"
      if [ -z "${CHANGED_STACKS}" ]; then
        echo "No changed stacks detected. Nothing to plan."
        exit 0
      fi

      echo "Changed stacks to plan:"
      echo "${CHANGED_STACKS}"
      while IFS= read -r rel_module_dir; do
        module_dir="${TF_ROOT}/${rel_module_dir}"
        safe_module_name="$(echo "${rel_module_dir}" | sed 's#[/ ]#_#g')"
        module_plan_file="${PLAN_ROOT}/${safe_module_name}.tfplan"
        module_show_file="${PLAN_ROOT}/${safe_module_name}.show.json"
        module_summary_md_file="${PLAN_ROOT}/reports/${safe_module_name}.tf-summarize.md"
        module_summary_html_file="${PLAN_ROOT}/reports/${safe_module_name}.tf-summarize.html"
        module_markdown_file="${PLAN_ROOT}/reports/${safe_module_name}.plan.md"
        module_policies_file="${PLAN_ROOT}/reports/${safe_module_name}.iam-policies.json"
        module_policies_compact_file="${PLAN_ROOT}/reports/${safe_module_name}.iam-policies.compact.json"
        module_policies_stderr_file="${PLAN_ROOT}/reports/${safe_module_name}.iam-policies.stderr.txt"

        echo "Planning stack: ${rel_module_dir}"
        (
          cd "${module_dir}"
          terragrunt init -reconfigure

          plan_extra_args=()
          if grep -R --include='*.tf' -nE '^[[:space:]]*variable[[:space:]]+"tf_state_name"' . >/dev/null 2>&1; then
            plan_extra_args+=("-var=tf_state_name=${TF_STATE_NAME}")
          fi

          terragrunt plan -out "${module_plan_file}" "${plan_extra_args[@]}"
          terragrunt show -json "${module_plan_file}" > "${module_show_file}"

          if command -v tf-summarize >/dev/null 2>&1; then
            echo "--- tf-summarize (${rel_module_dir}) ---"
            # NOTE: -md/-html are mutually exclusive with -tree/-draw:
            #   * -tree + -md   -> hard error ("both -tree and -md should not be provided")
            #   * -tree + -html -> -html is SILENTLY IGNORED (CreateWriter returns
            #     TreeWriter first), so the "html" file would contain the ASCII
            #     drawable tree, not HTML.
            # Table/HTML writers are only selected WITHOUT -tree/-separate-tree.
            tf-summarize -md -out "${module_summary_md_file}" < "${module_show_file}" || true
            tf-summarize -html -out "${module_summary_html_file}" < "${module_show_file}" || true
            # tf-summarize -html emits bare <table> fragments; wrap them in a
            # minimal styled document so the artifact opens nicely in a browser.
            if [ -s "${module_summary_html_file}" ]; then
              tmp_html="${module_summary_html_file}.wrapped"
              {
                echo '<!DOCTYPE html>'
                echo '<html><head><meta charset="utf-8">'
                echo "<title>tf-summarize: ${rel_module_dir}</title>"
                echo '<style>body{font-family:system-ui,sans-serif;margin:2rem;color:#1f2328}h1{font-size:1.2rem}table{border-collapse:collapse;margin-bottom:2rem}th,td{border:1px solid #d0d7de;padding:.4rem .8rem;text-align:left;vertical-align:top}th{background:#f6f8fa}code{background:#f0f0f0;padding:.1rem .3rem;border-radius:3px}li{margin:.15rem 0}</style>'
                echo '</head><body>'
                echo "<h1>tf-summarize: ${rel_module_dir}</h1>"
                cat "${module_summary_html_file}"
                echo '</body></html>'
              } > "${tmp_html}"
              mv "${tmp_html}" "${module_summary_html_file}"
            fi
            # Collapsible section in the job log via ANSI markers
            # (HTML <details> does NOT render in job logs)
            if [ -s "${module_summary_md_file}" ]; then
              echo 'Click next line to expand/collapse the summarize of Terraform plan section below:'
              printf '\e[0Ksection_start:%d:tfsummarize_%s\r\e[0Ktf-summarize: %s\n' \
                "$(date +%s)" "${safe_module_name}" "${rel_module_dir}"
              cat "${module_summary_md_file}"
              printf '\e[0Ksection_end:%d\r\e[0K\n' "$(date +%s)"
            else
              ( tf-summarize -tree -draw < "${module_show_file}" ) || true
            fi
          else
            echo "WARNING: tf-summarize was not found. Text plan summary will be skipped."
          fi

          if [ -n "${TFPLAN2MD_BIN}" ]; then
            echo "--- tfplan2md (${rel_module_dir}) ---"
            "${TFPLAN2MD_BIN}" --render-target github < "${module_show_file}" > "${module_markdown_file}" || true
            if [ -s "${module_markdown_file}" ]; then
              ( "${TFPLAN2MD_BIN}" --render-target github < "${module_show_file}" | glow - ) || true
            else
              echo "WARNING: tfplan2md produced empty markdown for ${rel_module_dir}; skipped."
            fi
          fi

          if [ -n "${IAM_POLICY_AUTOPILOT_BIN}" ]; then
            "${IAM_POLICY_AUTOPILOT_BIN}" telemetry --disable >/dev/null 2>&1 || true
            echo "--- iam-policy-autopilot (${rel_module_dir}) ---"
            : > "${module_policies_stderr_file}"
            # Artifacts: run first into a temp buffer; keep it as the raw
            # .iam-policies.json artifact ONLY when stdout really is the JSON
            # envelope ({ ... }). Failures (|| true) would otherwise leave a
            # non-JSON blob that jq/abs the note renderer would choke on.
            ipa_tmp="$(mktemp)"
            "${IAM_POLICY_AUTOPILOT_BIN}" generate-policies "${module_show_file}" --pretty \
              > "${ipa_tmp}" 2>> "${module_policies_stderr_file}" || true
            if [ -s "${ipa_tmp}" ] && [ "$(head -c 1 "${ipa_tmp}")" = "{" ]; then
              # Note artifact = pretty JSON -> the MR note (and this file)
              # render with newlines. Compact copy kept alongside for
              # storage/processing.
              mv "${ipa_tmp}" "${module_policies_file}"
              jq -c '.' "${module_policies_file}" > "${module_policies_compact_file}" 2>/dev/null || rm -f "${module_policies_compact_file}"
            else
              rm -f "${ipa_tmp}" "${module_policies_file}" "${module_policies_compact_file}"
              echo "NOTE: iam-policy-autopilot produced no JSON artifact for ${rel_module_dir}; see ${module_policies_stderr_file}" >&2
            fi
            # Console: pretty run, stdout straight to the job log (pure JSON;
            # logs go to stderr). Gated by IAM_POLICY_AUTOPILOT_APPEND_TO_JOB_LOG
            # (set "false" to keep the job log small on large diffs).
            if [ "${IAM_POLICY_AUTOPILOT_APPEND_TO_JOB_LOG:-true}" = "true" ]; then
              "${IAM_POLICY_AUTOPILOT_BIN}" generate-policies "${module_show_file}" --pretty \
                2>> "${module_policies_stderr_file}" || true
            else
              echo "NOTE: IAM policies NOT echoed to the job log"
              echo "      (IAM_POLICY_AUTOPILOT_APPEND_TO_JOB_LOG=${IAM_POLICY_AUTOPILOT_APPEND_TO_JOB_LOG:-})."
            fi
            [ -s "${module_policies_stderr_file}" ] || rm -f "${module_policies_stderr_file}"
          fi

          rm -f "${module_plan_file}" "${module_show_file}"
        )
      done <<< "${CHANGED_STACKS}"

      post_plan_note preview
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    when: always
    paths:
      - .terragrunt-plans/

plan-main:
  extends:
    - .iac_template_plan_base
  script:
    - !reference [.iac-plan-notes, script]
    - |
      set -euo pipefail
      cd ${TF_ROOT}
      echo "TLS env: SSL_CERT_FILE=${SSL_CERT_FILE:-} AWS_CA_BUNDLE=${AWS_CA_BUNDLE:-}"

      if ! command -v openssl >/dev/null 2>&1; then
        echo "ERROR: openssl is required but was not found in PATH."
        exit 1
      fi

      if [ -z "${TF_STATE_ARTIFACT_ENCRYPTION_KEY:-}" ]; then
        echo "ERROR: TF_STATE_ARTIFACT_ENCRYPTION_KEY is not set."
        exit 1
      fi

      if ! command -v tf-summarize >/dev/null 2>&1; then
        echo "WARNING: tf-summarize was not found. Text plan summary will be skipped."
      fi

      TFPLAN2MD_BIN=""
      if command -v tfplan2md >/dev/null 2>&1; then
        TFPLAN2MD_BIN="$(command -v tfplan2md)"
      elif [ -x /app/tfplan2md ]; then
        TFPLAN2MD_BIN="/app/tfplan2md"
      else
        echo "WARNING: tfplan2md was not found. Markdown plan rendering will be skipped."
      fi

      PLAN_ROOT="${TF_ROOT}/.terragrunt-plans"
      MANIFEST_FILE="${PLAN_ROOT}/plan-manifest.txt"
      REPORT_ROOT="${PLAN_ROOT}/reports"
      rm -rf "${PLAN_ROOT}"
      mkdir -p "${PLAN_ROOT}" "${REPORT_ROOT}"
      : > "${MANIFEST_FILE}"

      echo "================================================================"
      echo "plan-main is the deployable saved plan for this main pipeline."
      echo "1) Review the saved summaries before using the manual apply button"
      echo "for this pipeline. This job's own artifact (incl. encrypted plans)"
      echo "expires in 3 hours; job 'plan-main-save-plan-summary' keeps the"
      echo "reports/ directory as a long-lived artifact (no encrypted plans)."
      echo "Saved summaries: ${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/browse/.terragrunt-plans/reports?job=plan-main-save-plan-summary"
      echo "2) tf-summarize and tfplan2md are tools to detect changes"
      echo "They are best effort and may have bugs."
      echo "================================================================"

      # Fail fast on dependency cycles or invalid stack config: terramate
      # exits non-zero with a "cycle detected" error when the Terragrunt
      # dependency DAG is not acyclic.
      if ! terramate list --run-order >/dev/null 2>&1; then
        echo "ERROR: terramate could not build the stack dependency graph (cycle detected or invalid stack config)."
        echo "Run 'terramate list --run-order' locally to see the full error."
        exit 1
      fi

      # ${IAC_TERRAMATE_PLAN_EXTRA_FLAGS} defaults to
      # "--include-all-dependents --run-order": re-plan stacks that depend on
      # a changed stack (their inputs may change) and iterate in dependency
      # (DAG) execution order so the per-stack loop plans dependencies
      # before dependents. The manifest written below therefore lists
      # stacks in DAG order, and the apply job iterates it in that order.
      CHANGED_STACKS="$(terramate list --changed ${IAC_TERRAMATE_PLAN_EXTRA_FLAGS})"
      if [ -z "${CHANGED_STACKS}" ]; then
        echo "No changed stacks detected. Nothing to plan."
        exit 0
      fi
      echo "Changed stacks to plan:"
      echo "${CHANGED_STACKS}"

      while IFS= read -r rel_module_dir; do
        module_dir="${TF_ROOT}/${rel_module_dir}"
        safe_module_name="$(echo "${rel_module_dir}" | sed 's#[/ ]#_#g')"
        module_plan_file="${PLAN_ROOT}/${safe_module_name}.tfplan"
        module_show_file="${PLAN_ROOT}/${safe_module_name}.show.json"
        module_plan_encrypted_file="${module_plan_file}${PLAN_ENCRYPTED_SUFFIX}"
        module_summary_file="${REPORT_ROOT}/${safe_module_name}.summary.txt"
        module_summary_md_file="${REPORT_ROOT}/${safe_module_name}.tf-summarize.md"
        module_summary_html_file="${REPORT_ROOT}/${safe_module_name}.tf-summarize.html"
        module_markdown_file="${REPORT_ROOT}/${safe_module_name}.plan.md"
        module_markdown_stderr_file="${REPORT_ROOT}/${safe_module_name}.plan.stderr.txt"
        module_text_file="${REPORT_ROOT}/${safe_module_name}.plan.txt"

        echo "Planning module: ${rel_module_dir}"
        (
          cd "${module_dir}"
          terragrunt init -reconfigure

          plan_extra_args=()
          if grep -R --include='*.tf' -nE '^[[:space:]]*variable[[:space:]]+"tf_state_name"' . >/dev/null 2>&1; then
            plan_extra_args+=("-var=tf_state_name=${TF_STATE_NAME}")
          fi

          terragrunt plan -out "${module_plan_file}" "${plan_extra_args[@]}"
          terragrunt show -json "${module_plan_file}" > "${module_show_file}"

          if command -v tf-summarize >/dev/null 2>&1; then
            echo "--- tf-summarize (${rel_module_dir}) ---"
            # NOTE: -md/-html are mutually exclusive with -tree/-draw:
            #   * -tree + -md   -> hard error ("both -tree and -md should not be provided")
            #   * -tree + -html -> -html is SILENTLY IGNORED (CreateWriter returns
            #     TreeWriter first), so the "html" file would contain the ASCII
            #     drawable tree, not HTML.
            # Table/HTML writers are only selected WITHOUT -tree/-separate-tree.
            tf-summarize -md -out "${module_summary_md_file}" < "${module_show_file}" || true
            tf-summarize -html -out "${module_summary_html_file}" < "${module_show_file}" || true
            # tf-summarize -html emits bare <table> fragments; wrap them in a
            # minimal styled document so the artifact opens nicely in a browser.
            if [ -s "${module_summary_html_file}" ]; then
              tmp_html="${module_summary_html_file}.wrapped"
              {
                echo '<!DOCTYPE html>'
                echo '<html><head><meta charset="utf-8">'
                echo "<title>tf-summarize: ${rel_module_dir}</title>"
                echo '<style>body{font-family:system-ui,sans-serif;margin:2rem;color:#1f2328}h1{font-size:1.2rem}table{border-collapse:collapse;margin-bottom:2rem}th,td{border:1px solid #d0d7de;padding:.4rem .8rem;text-align:left;vertical-align:top}th{background:#f6f8fa}code{background:#f0f0f0;padding:.1rem .3rem;border-radius:3px}li{margin:.15rem 0}</style>'
                echo '</head><body>'
                echo "<h1>tf-summarize: ${rel_module_dir}</h1>"
                cat "${module_summary_html_file}"
                echo '</body></html>'
              } > "${tmp_html}"
              mv "${tmp_html}" "${module_summary_html_file}"
            fi
            # Collapsible section in the job log via ANSI markers
            # (HTML <details> does NOT render in job logs)
            if [ -s "${module_summary_md_file}" ]; then
              echo 'Click next line to expand/collapse the summarize of Terraform plan section below:'
              printf '\e[0Ksection_start:%d:tfsummarize_%s\r\e[0Ktf-summarize: %s\n' \
                "$(date +%s)" "${safe_module_name}" "${rel_module_dir}"
              cat "${module_summary_md_file}"
              printf '\e[0Ksection_end:%d\r\e[0K\n' "$(date +%s)"
            else
              ( tf-summarize -tree -draw < "${module_show_file}" | tee "${module_summary_file}" ) || true
            fi
          fi

          if [ -n "${TFPLAN2MD_BIN}" ]; then
            echo "--- tfplan2md (${rel_module_dir}) ---"
            tfplan2md_exit=0
            "${TFPLAN2MD_BIN}" --render-target github < "${module_show_file}" > "${module_markdown_file}" 2> "${module_markdown_stderr_file}" || tfplan2md_exit=$?

            if [ -s "${module_markdown_file}" ]; then
              ( "${TFPLAN2MD_BIN}" --render-target github < "${module_show_file}" | glow - ) || cat "${module_markdown_file}"
            else
              echo "WARNING: tfplan2md produced empty markdown for ${rel_module_dir}; falling back to plain-text plan output."
              echo "--- terragrunt show fallback (${rel_module_dir}) ---"
              ( terragrunt show "${module_plan_file}" | tee "${module_text_file}" ) || true
            fi
          fi

          rm -f "${module_show_file}"

          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:TF_STATE_ARTIFACT_ENCRYPTION_KEY \
            -in "${module_plan_file}" \
            -out "${module_plan_encrypted_file}"

          rm -f "${module_plan_file}"
        )

        echo "${rel_module_dir}|${module_plan_encrypted_file}" >> "${MANIFEST_FILE}"
      done <<< "${CHANGED_STACKS}"

      if [ ! -s "${MANIFEST_FILE}" ]; then
        echo "ERROR: manifest is empty after planning changed stacks"
        exit 1
      fi

      echo "Plan manifest generated:"
      cat "${MANIFEST_FILE}"

      post_plan_note main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  artifacts:
    access: developer
    expire_in: 3 hours
    paths:
      - .terragrunt-plans/

# Re-uploads plan-main's reports/ as a long-lived artifact (no
# expire_in). plan-main's own artifact still expires in 3 hours
# (it holds the encrypted plans + manifest), but GitLab expires a
# whole archive at once — reports inside it would vanish too.
# This job re-saves the non-sensitive remainder so plan summaries
# stay browsable. Encrypted plans never enter this artifact.
plan-main-save-plan-summary:
  stage: plan
  image: "${IAC_PIPELINE_IMAGE}"
  needs:
    - job: plan-main
      artifacts: true
  variables:
    GIT_STRATEGY: none
  cache: []
  script:
    - |
      set -euo pipefail
      cd ${TF_ROOT}

      if [ ! -d .terragrunt-plans ]; then
        echo "ERROR: .terragrunt-plans/ not found in downloaded artifacts"
        echo "(has plan-main uploaded its artifact?). Nothing to save."
        exit 1
      fi

      echo "Downloaded artifact content:"
      find .terragrunt-plans -type f | sort

      # Defence in depth: encrypted plans are plan-main/apply-only,
      # they must not end up in this long-lived artifact.
      rm -f .terragrunt-plans/*.tfplan"${PLAN_ENCRYPTED_SUFFIX}"

      echo ""
      echo "Remaining files to save (no expiry):"
      find .terragrunt-plans -type f | sort

      if [ ! -d .terragrunt-plans/reports ] || [ -z "$(ls -A .terragrunt-plans/reports)" ]; then
        echo "WARNING: reports/ directory is missing or empty."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  artifacts:
    when: always
    access: developer
    paths:
      - .terragrunt-plans/

apply:
  stage: apply
  image: "${IAC_PIPELINE_IMAGE}"
  resource_group: "${IAC_RESOURCE_GROUP}"
  needs:
    - job: plan-main
      artifacts: true
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: fetch
  before_script:
    - |
      set -euo pipefail

      normalize_cert() {
        input_path="$1"
        output_path="$2"

        if openssl x509 -in "$input_path" -noout >/dev/null 2>&1; then
          openssl x509 -in "$input_path" -out "$output_path" >/dev/null 2>&1 || cp -f "$input_path" "$output_path"
          return 0
        fi

        if openssl x509 -inform DER -in "$input_path" -noout >/dev/null 2>&1; then
          openssl x509 -inform DER -in "$input_path" -out "$output_path"
          return 0
        fi

        echo "ERROR: '$input_path' is not a valid X.509 certificate (PEM or DER)." >&2
        return 1
      }

      if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
        cp /etc/ssl/certs/ca-certificates.crt /tmp/ci-ca-bundle.crt
      elif [ -f /etc/pki/tls/certs/ca-bundle.crt ]; then
        cp /etc/pki/tls/certs/ca-bundle.crt /tmp/ci-ca-bundle.crt
      else
        touch /tmp/ci-ca-bundle.crt
      fi
      if [ -n "${LOCAL_INTERMEDIATE_CA_CERT_FILE:-}" ] && [ -f "${LOCAL_INTERMEDIATE_CA_CERT_FILE}" ]; then
        echo "Appending intermediate CA: ${LOCAL_INTERMEDIATE_CA_CERT_FILE}"
        normalize_cert "${LOCAL_INTERMEDIATE_CA_CERT_FILE}" /tmp/local-intermediate.pem
        printf '\n' >> /tmp/ci-ca-bundle.crt
        cat /tmp/local-intermediate.pem >> /tmp/ci-ca-bundle.crt
      fi
      if [ -n "${LOCAL_ROOT_CA_CERT_FILE:-}" ] && [ -f "${LOCAL_ROOT_CA_CERT_FILE}" ]; then
        echo "Appending root CA: ${LOCAL_ROOT_CA_CERT_FILE}"
        normalize_cert "${LOCAL_ROOT_CA_CERT_FILE}" /tmp/local-root.pem
        printf '\n' >> /tmp/ci-ca-bundle.crt
        cat /tmp/local-root.pem >> /tmp/ci-ca-bundle.crt
      fi
      for runner_ca in \
          /usr/local/share/ca-certificates/ca-cert-ca.pem \
          /etc/ssl/certs/ca-cert-ca.pem \
          /usr/share/ca-certificates/ca-cert-ca.pem; do
        if [ -f "${runner_ca}" ]; then
          echo "Appending runner-injected CA bundle: ${runner_ca}"
          printf '\n' >> /tmp/ci-ca-bundle.crt
          cat "${runner_ca}" >> /tmp/ci-ca-bundle.crt
          break
        fi
      done
      echo "CA bundle ready: /tmp/ci-ca-bundle.crt ($(wc -l < /tmp/ci-ca-bundle.crt) lines)"

      export SSL_CERT_FILE=/tmp/ci-ca-bundle.crt
      export AWS_CA_BUNDLE=/tmp/ci-ca-bundle.crt
      export GIT_SSL_CAINFO=/tmp/ci-ca-bundle.crt
      export CURL_CA_BUNDLE=/tmp/ci-ca-bundle.crt

      git config --global http.sslCAInfo /tmp/ci-ca-bundle.crt
      git config --global --add safe.directory "${CI_PROJECT_DIR}"

      if [ -n "${SOPS_AGE_KEY:-}" ]; then
        umask 077
        printf '%s' "${SOPS_AGE_KEY}" | tr -d '\r' > /tmp/sops-age.key
        printf '\n' >> /tmp/sops-age.key
        export SOPS_AGE_KEY_FILE=/tmp/sops-age.key
      fi
      if [ -n "${SOPS_AGE_KEY_FILE:-}" ]; then
        if [ ! -r "${SOPS_AGE_KEY_FILE}" ]; then
          echo "ERROR: SOPS_AGE_KEY_FILE is set but not readable: ${SOPS_AGE_KEY_FILE}" >&2
          exit 1
        fi

        first_key_line="$(awk 'NF { print; exit }' "${SOPS_AGE_KEY_FILE}" || true)"
        case "${first_key_line}" in
          AGE-SECRET-KEY-1*)
            echo "SOPS age key: configured via SOPS_AGE_KEY_FILE=${SOPS_AGE_KEY_FILE}"
            ;;
          age1*)
            echo "ERROR: SOPS age key looks like a public recipient, not a private identity." >&2
            echo "Expected the first non-empty line to start with AGE-SECRET-KEY-1." >&2
            exit 1
            ;;
          -----BEGIN\ AGE\ ENCRYPTED\ FILE-----*)
            echo "ERROR: SOPS age key looks like an encrypted age file, not a decrypted private identity." >&2
            exit 1
            ;;
          "")
            echo "ERROR: SOPS age key file is empty: ${SOPS_AGE_KEY_FILE}" >&2
            exit 1
            ;;
          *)
            echo "ERROR: SOPS age key does not look like an age private identity." >&2
            echo "First non-empty line: ${first_key_line}" >&2
            exit 1
            ;;
        esac

        if command -v age-keygen >/dev/null 2>&1; then
          derived_recipient="$(age-keygen -y "${SOPS_AGE_KEY_FILE}" 2>/dev/null || true)"
          if [ -n "${derived_recipient}" ]; then
            echo "SOPS age recipient derived from CI key: ${derived_recipient}"
          else
            echo "WARNING: age-keygen is available but could not derive a recipient from ${SOPS_AGE_KEY_FILE}" >&2
          fi
        else
          echo "NOTE: age-keygen not available; skipping recipient derivation"
        fi
      else
        echo "SOPS age key: NOT configured (SOPS_AGE_KEY/SOPS_AGE_KEY_FILE missing)"
      fi
      mkdir -p "${HOME}/.terraform.d/plugins"
    # IAM Roles Anywhere: configure credential_process (no-op unless AWS_RA_ENABLED=true).
    - !reference [.iac_template_aws_ra_init, script]
  script:
    - |
      set -euo pipefail
      cd ${TF_ROOT}
      PLAN_ROOT="${TF_ROOT}/.terragrunt-plans"
      MANIFEST_FILE="${PLAN_ROOT}/plan-manifest.txt"
      default_branch="${CI_DEFAULT_BRANCH:-main}"

      if ! command -v openssl >/dev/null 2>&1; then
        echo "ERROR: openssl is required but was not found in PATH."
        exit 1
      fi

      if ! command -v git >/dev/null 2>&1; then
        echo "ERROR: git is required for the apply freshness check but was not found in PATH."
        exit 1
      fi

      echo "Checking whether ${CI_COMMIT_SHA} is still the current origin/${default_branch} tip..."
      git fetch --prune origin \
        "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"

      current_origin_tip="$(git rev-parse "refs/remotes/origin/${default_branch}")"
      if [ "${CI_COMMIT_SHA}" != "${current_origin_tip}" ]; then
        echo "ERROR: this pipeline was created for commit ${CI_COMMIT_SHA}, but origin/${default_branch} now points to ${current_origin_tip}."
        echo "Refusing to apply an older saved plan. Use the newest ${default_branch} pipeline instead."
        exit 1
      fi

      echo "Freshness check passed: ${CI_COMMIT_SHA} is still the current origin/${default_branch} tip."

      if [ -z "${TF_STATE_ARTIFACT_ENCRYPTION_KEY:-}" ]; then
        echo "ERROR: TF_STATE_ARTIFACT_ENCRYPTION_KEY is not set."
        exit 1
      fi

      if [ ! -f "${MANIFEST_FILE}" ]; then
        echo "ERROR: plan manifest '${MANIFEST_FILE}' not found!"
        exit 1
      fi
      if [ ! -s "${MANIFEST_FILE}" ]; then
        echo "No changed stacks were planned. Nothing to apply."
        exit 0
      fi

      # Sanity check: plan-main writes the manifest in Terramate DAG
      # execution order (--run-order), so dependencies are applied before
      # dependents. Verify the manifest order matches the DAG order for the
      # stacks it contains; warn (non-fatal) on mismatch so a future change
      # to the plan job cannot silently break apply ordering.
      if command -v terramate >/dev/null 2>&1; then
        dag_order="$(terramate list --run-order 2>/dev/null || true)"
        if [ -n "${dag_order}" ]; then
          manifest_order="$(cut -d'|' -f1 "${MANIFEST_FILE}")"
          expected_order="$(printf '%s\n' "${dag_order}" | grep -Fxf <(printf '%s\n' "${manifest_order}") || true)"
          if [ "${manifest_order}" != "${expected_order}" ]; then
            echo "WARNING: plan manifest order does not match Terramate DAG execution order."
            echo "Manifest order: $(echo "${manifest_order}" | tr '\n' ' ')"
            echo "DAG order:      $(echo "${expected_order}" | tr '\n' ' ')"
            echo "Applying in manifest order anyway (plan-main wrote it); if apply fails on a dependency, re-plan."
          else
            echo "Manifest order matches Terramate DAG execution order."
          fi
        fi
      fi

      while IFS='|' read -r rel_module_dir module_plan_encrypted_file; do
        if [ "${rel_module_dir}" = "." ]; then
          module_dir="${TF_ROOT}"
        else
          module_dir="${TF_ROOT}/${rel_module_dir}"
        fi

        if [ ! -f "${module_plan_encrypted_file}" ]; then
          echo "ERROR: encrypted plan file '${module_plan_encrypted_file}' not found for module '${rel_module_dir}'"
          exit 1
        fi

        module_plan_file="${module_plan_encrypted_file%${PLAN_ENCRYPTED_SUFFIX}}"

        openssl enc -d -aes-256-cbc -pbkdf2 \
          -pass env:TF_STATE_ARTIFACT_ENCRYPTION_KEY \
          -in "${module_plan_encrypted_file}" \
          -out "${module_plan_file}"

        echo "=== PLAN TO BE APPLIED (${rel_module_dir}) ==="
        (
          cd "${module_dir}"
          terragrunt show "${module_plan_file}"
          echo "=== APPLYING SAVED PLAN (${rel_module_dir}) ==="
          terragrunt apply "${module_plan_file}"
        )

        rm -f "${module_plan_file}"
      done < "${MANIFEST_FILE}"

      echo "All modules applied successfully."

      # Actively delete plan-main's artifact so its encrypted saved plan
      # cannot be re-applied a second time within the expire_in window.
      # CI_JOB_TOKEN cannot delete job artifacts (API), so this requires
      # GITLAB_API_TOKEN (masked, api scope, Maintainer+). Non-fatal on
      # failure: plan-main's expire_in is the fallback safety net.
      if [ -n "${GITLAB_API_TOKEN:-}" ]; then
        PLAN_MAIN_JOB_ID="$(curl --silent --fail \
            --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs?per_page=100" \
          | jq -r '.[] | select(.name == "plan-main" and .status == "success") | .id' \
          | head -n 1 || true)"
        if [ -n "${PLAN_MAIN_JOB_ID}" ] && [ "${PLAN_MAIN_JOB_ID}" != "null" ]; then
          echo "Deleting plan-main artifacts (job ${PLAN_MAIN_JOB_ID}) to prevent replay..."
          curl --silent --fail --request DELETE \
            --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${PLAN_MAIN_JOB_ID}/artifacts" \
            && echo "Deleted." \
            || echo "WARNING: failed to delete plan-main artifacts (non-fatal; expire_in still applies)"
        else
          echo "WARNING: could not find a successful plan-main job in this pipeline; skipping delete."
        fi
      else
        echo "NOTE: GITLAB_API_TOKEN not set; plan-main artifacts left until expire_in."
      fi

      echo "The summaries remain browsable via 'plan-main-save-plan-summary' (no expiry)."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  manual_confirmation: 'Confirm that you reviewed the plan/summary/artifacts for the task plan-main for this pipeline and want to apply that exact saved plan.'
